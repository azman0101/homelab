schemaVersion: '2.0.0'

commandTests:
  - name: 'redis-server binary check'
    command: 'redis-server'
    args: ['--version']
    expectedOutput: ['Redis server v=\d+\.\d+']

  - name: 'redis-cli binary check'
    command: 'redis-cli'
    args: ['--version']
    expectedOutput: ['redis-cli \d+\.\d+']

fileExistenceTests:
  - name: 'redis-server executable'
    path: '/usr/local/bin/redis-server'
    shouldExist: true

  - name: 'redis-cli executable'
    path: '/usr/local/bin/redis-cli'
    shouldExist: true

  - name: 'docker-entrypoint.sh script'
    path: '/usr/local/bin/docker-entrypoint.sh'
    shouldExist: true

  - name: 'data directory'
    path: '/data'
    shouldExist: true

metadataTest:
  envVars:
    - key: 'PATH'
      value: '/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
    - key: 'REDIS_VERSION'
      value: '8.8.0'
  exposedPorts: ['6379']
  entrypoint: ['docker-entrypoint.sh']
  cmd: ['redis-server']
  workdir: '/data'
