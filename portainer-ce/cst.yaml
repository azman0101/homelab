schemaVersion: 2.0.0
commandTests:
- name: Upstream version
  command: /portainer
  args:
  - --version
  # Portainer prints its version on stderr; match any version so Dependabot bumps don't break the test.
  expectedError:
  - '\d+\.\d+\.\d+'
fileExistenceTests:
- name: Upstream entrypoint or application
  path: /portainer
  shouldExist: true
