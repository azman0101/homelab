schemaVersion: 2.0.0
commandTests:
- name: Upstream version
  command: python
  args:
  - -c
  - from changedetectionio import __version__; print(__version__)
  # Match any version so Dependabot bumps don't break the test.
  expectedOutput:
  - '\d+\.\d+\.\d+'
fileExistenceTests:
- name: Upstream entrypoint or application
  path: /app/changedetection.py
  shouldExist: true
