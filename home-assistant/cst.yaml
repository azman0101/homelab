schemaVersion: "2.0.0"

metadataTest:
  entrypoint: ["/init"]
  workdir: "/config"
  envVars:
    - key: "LANG"
      value: "C.UTF-8"
    - key: "S6_BEHAVIOUR_IF_STAGE2_FAILS"
      value: "2"
    - key: "UV_SYSTEM_PYTHON"
      value: "true"
commandTests:
  - name: "Python Version Check"
    command: "python3"
    args: ["--version"]
    regexOutput: ["Python 3.*"]

  - name: "Home Assistant Version Check"
    command: "hass"
    args: ["--version"]
    regexOutput: ["[0-9]{4}\\.[0-9]+\\.[0-9]+"]

fileExistenceTests:
  - name: "Check entrypoint binary"
    path: "/init"
    shouldExist: true

  - name: "Check config directory"
    path: "/config"
    shouldExist: true
