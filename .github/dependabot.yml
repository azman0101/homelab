version: 2
updates:
  # Version updates: batches on the 1st and 15th at 06:00 UTC.
  # Leave >=14 days between checks for the 4-day embargo and a merge window.
  # Keep PRs visible: exclude all dependencies from native cooldown (including
  # its default delay). Waiting is enforced by the PR embargo, not version filtering.
  # The schedule limits superseding PRs, including Docker digest updates.
  # Disable automatic rebases to limit superseding; a rebase with identical changes keeps its embargo clock.
  # Dependabot security updates do not follow the version-update schedule.
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 6 1,15 * *"
    cooldown:
      exclude:
        - "*"
    rebase-strategy: "disabled"

  # Docker Images
  - package-ecosystem: "docker"
    directory: "/authelia"
    schedule:
      interval: "cron"
      cronjob: "0 6 1,15 * *"
    cooldown:
      exclude:
        - "*"
    rebase-strategy: "disabled"

  - package-ecosystem: "docker"
    directory: "/caddy"
    schedule:
      interval: "cron"
      cronjob: "0 6 1,15 * *"
    cooldown:
      exclude:
        - "*"
    rebase-strategy: "disabled"
    allow:
      - dependency-name: "caddy"
    labels:
      - "dependencies"
      - "automated-merge"

  - package-ecosystem: "docker"
    directory: "/crowdsec"
