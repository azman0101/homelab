version: 2
updates:
  # Check daily and let new releases age for four days before proposing them.
  # The separate PR embargo still applies after a PR is opened.
  # Security updates do not follow the version-update cooldown.
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 4
    rebase-strategy: "disabled"

  # Docker Images
  - package-ecosystem: "docker"
    directory: "/authelia"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 4
    rebase-strategy: "disabled"

  - package-ecosystem: "docker"
    directory: "/caddy"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 4
    rebase-strategy: "disabled"
    allow:
      - dependency-name: "caddy"
    labels:
      - "dependencies"
      - "automated-merge"

  - package-ecosystem: "docker"
    directory: "/crowdsec"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 4
    rebase-strategy: "disabled"

  - package-ecosystem: "docker"
    directory: "/frigate"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 4
    rebase-strategy: "disabled"

  - package-ecosystem: "docker"
    directory: "/home-assistant"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 4
    rebase-strategy: "disabled"

  - package-ecosystem: "docker"
    directory: "/mosquitto"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 4
    rebase-strategy: "disabled"

  - package-ecosystem: "docker"
    directory: "/pihole"
