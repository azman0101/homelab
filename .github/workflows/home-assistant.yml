name: Build and Publish home-assistant

on:
  push:
    paths:
      - 'home-assistant/**'
      - '.github/workflows/home-assistant.yml'
      - '.github/workflows/build-image.yml'
    tags:
      - 'home-assistant/v*'
  schedule:
    - cron: '0 11 * * 1'   # Weekly Monday 11:00 UTC to catch upstream CVE fixes
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write          # keyless cosign OIDC signing
  security-events: write   # upload Trivy SARIF to GitHub Security tab

jobs:
  build-and-push:
    uses: ./.github/workflows/build-image.yml
    with:
      service_name: home-assistant
      image_title: Home Assistant
    secrets: inherit
