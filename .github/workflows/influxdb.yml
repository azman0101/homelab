name: Build and Publish influxdb

on:
  push:
    paths:
      - 'influxdb/**'
      - '.github/workflows/influxdb.yml'
      - '.github/workflows/build-image.yml'
    tags:
      - 'influxdb/v*'
  schedule:
    - cron: '0 3 * * 1'   # Weekly Monday 03:00 UTC to catch upstream CVE fixes
  workflow_dispatch:

jobs:
  build-and-push:
    uses: ./.github/workflows/build-image.yml
    with:
      service_name: influxdb
    secrets: inherit
