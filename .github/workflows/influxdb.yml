name: Build and Publish influxdb

on:
  push:
    paths:
      - 'influxdb/**'
      - '.github/workflows/influxdb.yml'
      - '.github/workflows/build-image.yml'
    tags:
      - 'influxdb/v*'
  schedule:
    - cron: '0 13 * * 1'   # Weekly Monday 13:00 UTC to catch upstream CVE fixes
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write          # keyless cosign OIDC signing
  security-events: write   # upload Trivy SARIF to GitHub Security tab

jobs:
  build-and-push:
    uses: ./.github/workflows/build-image.yml
    with:
      service_name: influxdb
    secrets: inherit
