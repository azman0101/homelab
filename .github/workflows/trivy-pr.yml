name: Trivy PR Scan

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.extract.outputs.images }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract parent images
        id: extract
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" == "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only --diff-filter=AM origin/"$BASE_REF" "$SHA" || true)
          else
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              CHANGED_FILES=$(git diff --name-only --diff-filter=AM "$BEFORE" "$SHA" || true)
            else
              CHANGED_FILES=$(git diff --name-only --diff-filter=AM HEAD~1 "$SHA" || true)
            fi
          fi

          DOCKERFILES=""
          if [ -n "$CHANGED_FILES" ]; then
            for file in $CHANGED_FILES; do
              dir=$(dirname "$file")
              while [ "$dir" != "/" ]; do
                if [ -f "$dir/Dockerfile" ]; then
                  DOCKERFILES="$DOCKERFILES $dir/Dockerfile"
                  break
                fi
                if [ "$dir" = "." ]; then
                  break
                fi
                dir=$(dirname "$dir")
              done
            done
            DOCKERFILES=$(echo "$DOCKERFILES" | tr ' ' '\n' | sort -u | grep -v '^$' || true)
          fi

          if [ -z "$DOCKERFILES" ]; then
            IMAGES='[]'
          else
            IMAGES=$(echo "$DOCKERFILES" | tr '\n' '\0' | xargs -0 -r awk '/^FROM / {for(i=2;i<=NF;i++) if($i !~ /^--/) {print $i; break}}' | sort -u | jq -R -s -c 'split("\n")[:-1]')
            if [ "$IMAGES" = "[]" ] || [ -z "$IMAGES" ]; then
              IMAGES='[]'
            fi
          fi
          echo "images=$IMAGES" >> $GITHUB_OUTPUT

  scan:
    needs: prepare
    if: ${{ needs.prepare.outputs.images != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.prepare.outputs.images) }}
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ matrix.image }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: ${{ matrix.image }}
