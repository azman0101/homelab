name: Trivy PR Scan

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.extract.outputs.images }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Extract parent images
        id: extract
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # Get modified Dockerfiles using diff-filter=AM to ignore deleted/renamed files
            # No null termination since bash variables can't handle null bytes well, and spaces are unlikely for our Dockerfiles.
            # Using -E '(^|/)Dockerfile$' to strictly match Dockerfiles
            DOCKERFILES=$(git diff --name-only --diff-filter=AM origin/${{ github.base_ref }} ${{ github.sha }} | grep -E '(^|/)Dockerfile$' || true)
          else
            # Find all Dockerfiles for push to default branch
            DOCKERFILES=$(find . -name Dockerfile)
          fi

          if [ -z "$DOCKERFILES" ]; then
            IMAGES='[]'
          else
            IMAGES=$(echo "$DOCKERFILES" | tr '\n' '\0' | xargs -0 -r awk '/^FROM / {for(i=2;i<=NF;i++) if($i !~ /^--/) {print $i; break}}' | sort -u | jq -R -s -c 'split("\n")[:-1]')
            if [ "$IMAGES" = "[]" ] || [ -z "$IMAGES" ]; then
              IMAGES='[]'
            fi
          fi
          echo "images=$IMAGES" >> $GITHUB_OUTPUT

  scan:
    needs: prepare
    if: ${{ needs.prepare.outputs.images != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.prepare.outputs.images) }}
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ matrix.image }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: ${{ matrix.image }}
