name: Build, Test, and Publish Container Image

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
        description: 'The name of the service/directory (e.g. authelia, caddy)'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/${{ inputs.service_name }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write          # keyless cosign OIDC signing
      security-events: write   # upload Trivy SARIF to GitHub Security tab

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan dependencies for malicious behavior (Socket)
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: |
          if [ -n "$SOCKET_SECURITY_API_KEY" ]; then
            npx -y @socketsecurity/cli@1.1.170 scan ./${{ inputs.service_name }} || true
          else
            echo "No Socket API key provided, skipping behavioral scan."
          fi

      - name: Get base image version
        id: version
        run: |
          # Extracts the version and prepends 'v' only if it starts with a digit
          VERSION=$(grep "FROM" ${{ inputs.service_name }}/Dockerfile | tail -n 1 | cut -d ':' -f 2 | cut -d '@' -f 1 | xargs)
          VERSION=$(echo $VERSION | sed -E 's/^([0-9])/v\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.1
        with:
          context: ./${{ inputs.service_name }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true

      - name: Run Container Structure Tests
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          CST_IMAGE_TAG: gcr.io/gcp-runtimes/container-structure-test:v1.16.0
          # Update CST_BINARY_SHA256 whenever CST_IMAGE_TAG is bumped (linux/amd64 digest of the binary inside the image)
          CST_BINARY_SHA256: 9cc21a2dbe6f72a6a10195cc3b6fd1db5eb76c4aaeac09b42b06a6f017f4de4a # linux/amd64 binary checksum for v1.16.0
          SERVICE_NAME: ${{ inputs.service_name }}
        run: |
          CST_CONFIG=""
          for f in "${SERVICE_NAME}/cst.yaml" "${SERVICE_NAME}/container-structure-test.yaml" "${SERVICE_NAME}/container-structure-test.yml"; do
            if [ -f "$f" ]; then
              CST_CONFIG="$f"
              break
            fi
          done

          if [ -n "$CST_CONFIG" ]; then
            echo "Found Container Structure Test config: ${CST_CONFIG}"
            docker pull "${IMAGE_REF}"
            docker pull "${CST_IMAGE_TAG}"
            CST_CONTAINER_ID=$(docker create "${CST_IMAGE_TAG}")
            docker cp "${CST_CONTAINER_ID}:/container-structure-test" /tmp/container-structure-test
            docker rm "${CST_CONTAINER_ID}"
            chmod +x /tmp/container-structure-test
            echo "${CST_BINARY_SHA256}  /tmp/container-structure-test" | sha256sum -c -
            /tmp/container-structure-test test --image "${IMAGE_REF}" --config "${CST_CONFIG}"
          else
            echo "No Container Structure Test config found for ${SERVICE_NAME}, skipping."
          fi

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: ${{ inputs.service_name }}

      - name: Submit SBOM to GitHub Dependency Graph
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: 'github'
          output: 'dependency-results.sbom.json'
          github-pat: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign the published Docker image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          images=()
          for tag in ${TAGS}; do
            images+=("${tag}@${DIGEST}")
          done
          cosign sign --yes "${images[@]}"

      - name: Verify SLSA provenance (BuildKit attestation)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST} \
            --format '{{ json .Provenance }}'
