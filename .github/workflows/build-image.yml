name: Build, Test, and Publish Container Image

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
        description: 'The name of the service/directory (e.g. authelia, caddy)'
      image_title:
        required: false
        type: string
        default: ''
        description: 'Optional OCI image title override'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/${{ inputs.service_name }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write          # keyless cosign OIDC signing
      security-events: write   # upload Trivy SARIF to GitHub Security tab

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan dependencies for malicious behavior (Socket)
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: |
          if [ -n "$SOCKET_SECURITY_API_KEY" ]; then
            npx -y @socketsecurity/cli@1.1.170 scan ./${{ inputs.service_name }} || true
          else
            echo "No Socket API key provided, skipping behavioral scan."
          fi

      - name: Get base image version
        id: version
        run: |
          # Extracts the version and prepends 'v' only if it starts with a digit
          VERSION=$(grep "FROM" ${{ inputs.service_name }}/Dockerfile | tail -n 1 | cut -d ':' -f 2 | cut -d '@' -f 1 | xargs)
          VERSION=$(echo $VERSION | sed -E 's/^([0-9])/v\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=match,pattern=.*\/(v.*),group=1
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: |
            ${{ inputs.image_title != '' && format('org.opencontainers.image.title={0}', inputs.image_title) || '' }}

      - name: Compose image labels
        id: compose-labels
        env:
          META_LABELS: ${{ steps.meta.outputs.labels }}
          IMAGE_TITLE: ${{ inputs.image_title }}
        run: |
          {
            echo "labels<<EOF"
            if [ -n "$IMAGE_TITLE" ]; then
              printf '%s\n' "$META_LABELS" | sed '/^org.opencontainers.image.title=/d'
              printf 'org.opencontainers.image.title=%s\n' "$IMAGE_TITLE"
            else
              printf '%s\n' "$META_LABELS"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.1
        with:
          context: ./${{ inputs.service_name }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.compose-labels.outputs.labels }}
          sbom: true
          provenance: true

      - name: Run Container Structure Tests
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          SERVICE_NAME: ${{ inputs.service_name }}
        run: |
          docker pull "${IMAGE_REF}"
          scripts/run-structure-tests.sh "${SERVICE_NAME}" "${IMAGE_REF}"

      - name: Run Trivy vulnerability scanner
        if: ${{ !cancelled() && steps.build.outputs.digest != '' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          vuln-type: 'os,library'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: ${{ !cancelled() && steps.build.outputs.digest != '' && hashFiles('trivy-results.sarif') != '' }}
        with:
          sarif_file: trivy-results.sarif
          category: ${{ inputs.service_name }}

      - name: Submit SBOM to GitHub Dependency Graph
        if: ${{ !cancelled() && steps.build.outputs.digest != '' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: 'github'
          output: 'dependency-results.sbom.json'
          github-pat: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign the published Docker image
        if: ${{ !cancelled() && steps.build.outputs.digest != '' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          images=()
          for tag in ${TAGS}; do
            images+=("${tag}@${DIGEST}")
          done
          cosign sign --yes "${images[@]}"

      - name: Verify SLSA provenance (BuildKit attestation)
        if: ${{ !cancelled() && steps.build.outputs.digest != '' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST} \
            --format '{{ json .Provenance }}'

      - name: Record published version and pull reference in README
        if: ${{ success() && steps.build.outputs.digest != '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Other image builds (and release-on-bump) push to main too: re-apply on top of
          # the latest main and retry on conflict instead of failing the build.
          for attempt in $(seq 1 10); do
            git fetch origin main
            git reset --hard origin/main
            scripts/update-image-ref.sh published "${SERVICE_NAME}" "${VERSION}" "${DIGEST}"
            if git diff --quiet README.md; then
              echo "README already up to date."
              exit 0
            fi
            git add README.md
            git commit -m "docs: update ${SERVICE_NAME} image reference to ${VERSION}@${DIGEST}"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}), retrying..."
            sleep $((RANDOM % 10 + 2))
          done
          echo "Could not update README after 10 attempts" >&2
          exit 1
