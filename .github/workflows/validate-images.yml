name: Validate Images PR

on:
  # Dispatched by the trusted embargo controller after the waiting period.
  # No pull_request trigger: Draft alone does not prevent CI from running.
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: validate-pr-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  embargo:
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.authorize.outputs.head_sha }}
      base_sha: ${{ steps.authorize.outputs.base_sha }}
    steps:
      - name: Checkout trusted controller before touching PR content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify embargo for this exact PR head
        id: authorize
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: python3 scripts/pr-embargo.py authorize --number "$PR_NUMBER" --sha "$HEAD_SHA"

  prepare:
    needs: embargo
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.embargo.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect services to validate
        id: detect
        env:
          BASE_SHA: ${{ needs.embargo.outputs.base_sha }}
          SHA: ${{ needs.embargo.outputs.head_sha }}
        run: |
          CHANGED_FILES=$(git diff --name-only "${BASE_SHA}...${SHA}")

          ALL_SERVICES=$(for f in */Dockerfile; do dirname "$f"; done)

          # A change to the shared validation tooling re-validates every image.
          if echo "$CHANGED_FILES" | grep -qxE '\.github/workflows/validate-images?\.yml|scripts/run-structure-tests\.sh'; then
            SERVICES="$ALL_SERVICES"
          else
            SERVICES=$(echo "$CHANGED_FILES" | cut -d/ -f1 | sort -u | grep -Fx -f <(echo "$ALL_SERVICES") || true)
          fi

          echo "Services to validate: ${SERVICES:-none}"
          echo "services=$(echo "$SERVICES" | jq -R -s -c 'split("\n") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"

  validate:
    needs: [embargo, prepare]
    if: ${{ needs.prepare.outputs.services != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.services) }}
    uses: ./.github/workflows/validate-image.yml
    with:
      service_name: ${{ matrix.service }}
      head_sha: ${{ needs.embargo.outputs.head_sha }}

  # Report the outcome on the PR head itself: a workflow_dispatch run is attached to the
  # default branch, so without this the result would never be visible on (or gate) the PR.
  report:
    needs: [embargo, prepare, validate]
    # Skipped when cancelled: the controller re-dispatches a validation left pending.
    if: ${{ !cancelled() && needs.embargo.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish validation status on the PR head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ needs.embargo.outputs.head_sha }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Context must match "validation_context" in .github/embargo.json.
          if [ "$PREPARE_RESULT" = success ] && [ "$VALIDATE_RESULT" = success ]; then
            STATE=success; DESCRIPTION="Build, structure and smoke tests passed"
          elif [ "$PREPARE_RESULT" = success ] && [ "$VALIDATE_RESULT" = skipped ]; then
            STATE=success; DESCRIPTION="No image changed"
          else
            STATE=failure; DESCRIPTION="Validation failed (prepare: ${PREPARE_RESULT}, validate: ${VALIDATE_RESULT})"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$STATE" -f context="Validate images" \
            -f description="$DESCRIPTION" -f target_url="$RUN_URL"
