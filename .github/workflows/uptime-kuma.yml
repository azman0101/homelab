name: Build and Publish uptime-kuma

on:
  push:
    paths:
      - 'uptime-kuma/**'
      - '.github/workflows/uptime-kuma.yml'
      - '.github/workflows/build-image.yml'
    tags:
      - 'uptime-kuma/v*'
  schedule:
    - cron: '0 23 * * 1'   # Weekly Monday 23:00 UTC to catch upstream CVE fixes
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write          # keyless cosign OIDC signing
  security-events: write   # upload Trivy SARIF to GitHub Security tab

jobs:
  build-and-push:
    uses: ./.github/workflows/build-image.yml
    with:
      service_name: uptime-kuma
    secrets: inherit
