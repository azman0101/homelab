name: Build and Publish uptime-kuma

on:
  push:
    paths:
      - 'uptime-kuma/**'
      - '.github/workflows/uptime-kuma.yml'
      - '.github/workflows/build-image.yml'
    tags:
      - 'uptime-kuma/v*'
  schedule:
    - cron: '0 3 * * 1'   # Weekly Monday 03:00 UTC to catch upstream CVE fixes
  workflow_dispatch:

jobs:
  build-and-push:
    uses: ./.github/workflows/build-image.yml
    with:
      service_name: uptime-kuma
    secrets: inherit
