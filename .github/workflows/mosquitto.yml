name: Build and Publish mosquitto

on:
  push:
    paths:
      - 'mosquitto/**'
      - '.github/workflows/mosquitto.yml'
      - '.github/workflows/build-image.yml'
    tags:
      - 'mosquitto/v*'
  schedule:
    - cron: '0 3 * * 1'   # Weekly Monday 03:00 UTC to catch upstream CVE fixes
  workflow_dispatch:

jobs:
  build-and-push:
    uses: ./.github/workflows/build-image.yml
    with:
      service_name: mosquitto
    secrets: inherit
