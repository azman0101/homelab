name: Build and Publish caddy

on:
  push:
    paths:
      - 'caddy/**'
      - '.github/workflows/caddy.yml'
      - '.github/workflows/build-image.yml'
    tags:
      - 'caddy/v*'
  schedule:
    - cron: '0 5 * * 1'   # Weekly Monday 05:00 UTC to catch upstream CVE fixes
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write          # keyless cosign OIDC signing
  security-events: write   # upload Trivy SARIF to GitHub Security tab

jobs:
  build-and-push:
    uses: ./.github/workflows/build-image.yml
    with:
      service_name: caddy
    secrets: inherit
