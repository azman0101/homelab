name: Build and Publish postfix-relay

on:
  push:
    paths:
      - 'postfix-relay/**'
      - '.github/workflows/postfix-relay.yml'
      - '.github/workflows/build-image.yml'
    tags:
      - 'postfix-relay/v*'
  schedule:
    - cron: '0 19 * * 1'   # Weekly Monday 19:00 UTC to catch upstream CVE fixes
  workflow_dispatch:

jobs:
  build-and-push:
    uses: ./.github/workflows/build-image.yml
    with:
      service_name: postfix-relay
    secrets: inherit
