name: Build and Publish pihole

on:
  push:
    paths:
      - 'pihole/**'
      - '.github/workflows/pihole.yml'
      - '.github/workflows/build-image.yml'
    tags:
      - 'pihole/v*'
  schedule:
    - cron: '0 17 * * 1'   # Weekly Monday 17:00 UTC to catch upstream CVE fixes
  workflow_dispatch:

jobs:
  build-and-push:
    uses: ./.github/workflows/build-image.yml
    with:
      service_name: pihole
    secrets: inherit
