name: Release New Version

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect bumps, update READMEs and create releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # List of services to check
          SERVICES=("authelia" "caddy" "crowdsec" "frigate" "home-assistant" "influxdb" "mosquitto" "pihole" "postfix-relay" "redis" "uptime-kuma")

          for SERVICE in "${SERVICES[@]}"; do
            DOCKERFILE="$SERVICE/Dockerfile"
            if [ ! -f "$DOCKERFILE" ]; then
              echo "Warning: $DOCKERFILE not found, skipping."
              continue
            fi

            # Extracts the version and prepends 'v' only if it starts with a digit
            # We use 'tail -n 1' to pick the production image in multi-stage builds
            LAST_FROM=$(grep "FROM" "$DOCKERFILE" | tail -n 1)
            UPSTREAM_IMAGE=$(echo "$LAST_FROM" | sed -E 's/^FROM[[:space:]]+([^[:space:]]+).*/\1/')
            RAW_VERSION=$(echo "$UPSTREAM_IMAGE" | cut -d ':' -f 2 | cut -d '@' -f 1 | xargs)
            VERSION=$(echo "$RAW_VERSION" | sed -E 's/^([0-9])/v\1/')

            if [ -z "$VERSION" ]; then
              echo "Error: Could not extract version for $SERVICE"
              continue
            fi

            # The tag format used in build workflows is [service]/v*
            TAG="$SERVICE/$VERSION"
            echo "Checking tag for $SERVICE: $TAG"

            # Check if tag already exists
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists, skipping."
            else
              echo "Tag $TAG missing! Creating release for $TAG"

              # Update service README.md if present
              SERVICE_README="$SERVICE/README.md"
              if [ -f "$SERVICE_README" ]; then
                UPSTREAM_IMG="$UPSTREAM_IMAGE" perl -i -0777 -pe 's/(## Upstream image\s*\n\n```\n).*?(\n```)/$1$ENV{UPSTREAM_IMG}$2/s' "$SERVICE_README"
              fi

              # Update root README.md version column
              SRV="$SERVICE" RAW_VER="$RAW_VERSION" perl -i -pe '
                $s = $ENV{SRV}; $v = $ENV{RAW_VER};
                if (/^\|\s*\[\Q$s\E\]\(\.\/\Q$s\E\)\s*\|/) {
                  @p = split(/\s*\|\s*/, $_);
                  $_ = "| $p[1] | $p[2] | $v |\n";
                }
              ' README.md

              PREV_TAG=$(git tag -l "$SERVICE/*" --sort=-v:refname | grep -v "^$TAG$" | head -n 1 || true)

              NOTES_FILE=$(mktemp)
              echo "## What's Changed" > "$NOTES_FILE"
              if [ -n "$PREV_TAG" ]; then
                git log "$PREV_TAG..HEAD" --pretty=format:"* %s (%h)" -- "$SERVICE" >> "$NOTES_FILE"
                echo -e "\n\n**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}" >> "$NOTES_FILE"
              else
                git log --pretty=format:"* %s (%h)" -n 20 -- "$SERVICE" >> "$NOTES_FILE"
              fi

              gh release create "$TAG" \
                --title "$TAG" \
                -F "$NOTES_FILE"

              rm -f "$NOTES_FILE"
            fi
          done

          # Commit README updates if any
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md */README.md; then
            git add README.md */README.md
            git commit -m "docs: update README files for released versions"
            git push origin main
          fi
