name: Release New Version

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'Bump')
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Detect bumps and create releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # List of services to check
          SERVICES=("authelia" "caddy" "crowdsec" "frigate" "home-assistant" "mosquitto" "pihole" "postfix-relay" "redis" "uptime-kuma")

          for SERVICE in "${SERVICES[@]}"; do
            # Check if commit message contains "Bump [service]"
            # We use case-insensitive matching to be safe
            if echo "$COMMIT_MSG" | grep -iq "Bump $SERVICE"; then
              echo "Detected bump for $SERVICE"
              
              DOCKERFILE="$SERVICE/Dockerfile"
              if [ ! -f "$DOCKERFILE" ]; then
                echo "Warning: $DOCKERFILE not found, skipping."
                continue
              fi

              # Extracts the version and prepends 'v' only if it starts with a digit
              # We use 'tail -n 1' to pick the production image in multi-stage builds
              RAW_VERSION=$(grep "FROM" "$DOCKERFILE" | tail -n 1 | cut -d ':' -f 2 | cut -d '@' -f 1 | xargs)
              VERSION=$(echo "$RAW_VERSION" | sed -E 's/^([0-9])/v\1/')
              
              if [ -z "$VERSION" ]; then
                echo "Error: Could not extract version for $SERVICE"
                continue
              fi

              # The tag format used in your build workflows is [service]/v*
              TAG="$SERVICE/$VERSION"
              echo "Target tag: $TAG"

              # Check if tag already exists
              if git rev-parse "$TAG" >/dev/null 2>&1; then
                echo "Tag $TAG already exists, skipping."
              else
                echo "Creating release for $TAG"
                gh release create "$TAG" \
                  --title "$TAG" \
                  --generate-notes
              fi
            fi
          done
