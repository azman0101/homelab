name: Release New Version

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'bump') || contains(github.event.head_commit.message, 'Bump')
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect bumps, update READMEs and create releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # List of services to check
          SERVICES=("authelia" "caddy" "crowdsec" "frigate" "home-assistant" "influxdb" "mosquitto" "pihole" "postfix-relay" "redis" "uptime-kuma")

          shopt -s nocasematch
          for SERVICE in "${SERVICES[@]}"; do
            # Check if commit message indicates bump for SERVICE (either "in /SERVICE" or "Bump ... SERVICE")
            if [[ "$COMMIT_MSG" == *"in /$SERVICE"* || "$COMMIT_MSG" == *"Bump "*"$SERVICE"* ]]; then
              echo "Detected bump for $SERVICE"

              DOCKERFILE="$SERVICE/Dockerfile"
              if [ ! -f "$DOCKERFILE" ]; then
                echo "Warning: $DOCKERFILE not found, skipping."
                continue
              fi

              # Extracts the version and prepends 'v' only if it starts with a digit
              # We use 'tail -n 1' to pick the production image in multi-stage builds
              LAST_FROM=$(grep "FROM" "$DOCKERFILE" | tail -n 1)
              UPSTREAM_IMAGE=$(echo "$LAST_FROM" | sed -E 's/^FROM[[:space:]]+([^[:space:]]+).*/\1/')
              RAW_VERSION=$(echo "$UPSTREAM_IMAGE" | cut -d ':' -f 2 | cut -d '@' -f 1 | xargs)
              VERSION=$(echo "$RAW_VERSION" | sed -E 's/^([0-9])/v\1/')

              if [ -z "$VERSION" ]; then
                echo "Error: Could not extract version for $SERVICE"
                continue
              fi

              # Update service README.md if present
              SERVICE_README="$SERVICE/README.md"
              if [ -f "$SERVICE_README" ]; then
                UPSTREAM_IMG="$UPSTREAM_IMAGE" perl -i -0777 -pe 's/(## Upstream image\s*\n\n```\n).*?(\n```)/$1$ENV{UPSTREAM_IMG}$2/s' "$SERVICE_README"
              fi

              # Update root README.md version column
              SRV="$SERVICE" RAW_VER="$RAW_VERSION" perl -i -pe '
                $s = $ENV{SRV}; $v = $ENV{RAW_VER};
                if (/^\|\s*\[\Q$s\E\]\(\.\/\Q$s\E\)\s*\|/) {
                  @p = split(/\s*\|\s*/, $_);
                  $_ = "| $p[1] | $p[2] | $v |\n";
                }
              ' README.md

              # The tag format used in your build workflows is [service]/v*
              TAG="$SERVICE/$VERSION"
              echo "Target tag: $TAG"

              # Check if tag already exists
              if git rev-parse "$TAG" >/dev/null 2>&1; then
                echo "Tag $TAG already exists, skipping."
              else
                echo "Creating release for $TAG"
                gh release create "$TAG" \
                  --title "$TAG" \
                  --generate-notes
              fi
            fi
          done
          shopt -u nocasematch

          # Commit README updates if any
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md */README.md; then
            git add README.md */README.md
            git commit -m "docs: update README files for released versions"
            git push origin main
          fi
