name: Release New Version

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'Bump')
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect bumps and create releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # List of services to check
          SERVICES=("authelia" "caddy" "crowdsec" "frigate" "home-assistant" "influxdb" "mosquitto" "pihole" "postfix-relay" "redis" "uptime-kuma")

          shopt -s nocasematch
          for SERVICE in "${SERVICES[@]}"; do
            # Check if commit message contains "Bump [service]"
            # We use case-insensitive matching to be safe
            if [[ "$COMMIT_MSG" == *"Bump $SERVICE"* ]]; then
              echo "Detected bump for $SERVICE"

              DOCKERFILE="$SERVICE/Dockerfile"
              if [ ! -f "$DOCKERFILE" ]; then
                echo "Warning: $DOCKERFILE not found, skipping."
                continue
              fi

              # Extracts the version and prepends 'v' only if it starts with a digit

              # We use a pure bash loop to pick the production image in multi-stage builds
              last_from=""
              while read -r line || [[ -n "$line" ]]; do
                if [[ "$line" == FROM* ]]; then
                  last_from="$line"
                fi
              done < "$DOCKERFILE"

              if [[ -n "$last_from" ]]; then
                RAW_VERSION="$last_from"

                if [[ "$RAW_VERSION" == *:* ]]; then
                  RAW_VERSION="${RAW_VERSION#*:}"
                  RAW_VERSION="${RAW_VERSION%%:*}"
                fi

                RAW_VERSION="${RAW_VERSION%%@*}"

                # trim whitespace
                RAW_VERSION="${RAW_VERSION#"${RAW_VERSION%%[![:space:]]*}"}"
                RAW_VERSION="${RAW_VERSION%"${RAW_VERSION##*[![:space:]]}"}"

                if [[ "$RAW_VERSION" =~ ^[0-9] ]]; then
                  VERSION="v$RAW_VERSION"
                else
                  VERSION="$RAW_VERSION"
                fi
              else
                VERSION=""
              fi

              if [ -z "$VERSION" ]; then
                echo "Error: Could not extract version for $SERVICE"
                continue
              fi

              # The tag format used in your build workflows is [service]/v*
              TAG="$SERVICE/$VERSION"
              echo "Target tag: $TAG"

              # Check if tag already exists
              if git rev-parse "$TAG" >/dev/null 2>&1; then
                echo "Tag $TAG already exists, skipping."
              else
                echo "Creating release for $TAG"
                gh release create "$TAG" \
                  --title "$TAG" \
                  --generate-notes
              fi
            fi
          done
          shopt -u nocasematch
