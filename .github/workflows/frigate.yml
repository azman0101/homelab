name: Build and Publish frigate

on:
  push:
    paths:
      - 'frigate/**'
      - '.github/workflows/frigate.yml'
      - '.github/workflows/build-image.yml'
    tags:
      - 'frigate/v*'
  schedule:
    - cron: '0 9 * * 1'   # Weekly Monday 09:00 UTC to catch upstream CVE fixes
  workflow_dispatch:

jobs:
  build-and-push:
    uses: ./.github/workflows/build-image.yml
    with:
      service_name: frigate
    secrets: inherit
