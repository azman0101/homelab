name: Build and Publish authelia

on:
  push:
    paths:
      - 'authelia/**'
      - '.github/workflows/authelia.yml'
      - '.github/workflows/build-image.yml'
    tags:
      - 'authelia/v*'
  schedule:
    - cron: '0 3 * * 1'   # Weekly Monday 03:00 UTC to catch upstream CVE fixes
  workflow_dispatch:

jobs:
  build-and-push:
    uses: ./.github/workflows/build-image.yml
    with:
      service_name: authelia
    secrets: inherit
