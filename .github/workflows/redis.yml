name: Build and Publish redis

on:
  push:
    paths:
      - 'redis/**'
      - '.github/workflows/redis.yml'
      - '.github/workflows/build-image.yml'
    tags:
      - 'redis/v*'
  schedule:
    - cron: '0 21 * * 1'   # Weekly Monday 21:00 UTC to catch upstream CVE fixes
  workflow_dispatch:

jobs:
  build-and-push:
    uses: ./.github/workflows/build-image.yml
    with:
      service_name: redis
    secrets: inherit
