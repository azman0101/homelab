name: Build and Publish crowdsec

on:
  push:
    paths:
      - 'crowdsec/**'
      - '.github/workflows/crowdsec.yml'
      - '.github/workflows/build-image.yml'
    tags:
      - 'crowdsec/v*'
  schedule:
    - cron: '0 7 * * 1'   # Weekly Monday 07:00 UTC to catch upstream CVE fixes
  workflow_dispatch:

jobs:
  build-and-push:
    uses: ./.github/workflows/build-image.yml
    with:
      service_name: crowdsec
    secrets: inherit
