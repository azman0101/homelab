name: Build and Publish sockpuppetbrowser

on:
  push:
    branches:
      - main
    paths:
      - 'sockpuppetbrowser/**'
      - '.github/workflows/sockpuppetbrowser.yml'
      - '.github/workflows/build-image.yml'
    tags:
      - 'sockpuppetbrowser/v*'
  schedule:
    - cron: '0 5 * * 2'   # Weekly Tuesday to catch upstream CVE fixes
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write          # keyless cosign OIDC signing
  security-events: write   # upload Trivy SARIF to GitHub Security tab

jobs:
  build-and-push:
    uses: ./.github/workflows/build-image.yml
    with:
      service_name: sockpuppetbrowser
    secrets: inherit
